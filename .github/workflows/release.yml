name: Build and Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from ModuleVersion
        id: version
        run: |
          VERSION=$(grep -oP 'ModuleVersion\s*=>\s*\$?"\K[^"]+' src/K4-WorldText-API.cs | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find ModuleVersion in src/K4-WorldText-API.cs"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Build K4-WorldText-API plugin
        run: |
          dotnet restore K4-WorldText-API.csproj
          dotnet build K4-WorldText-API.csproj -c Release --no-restore

      - name: Assemble release package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FOLDER="K4-WorldText-API-v${VERSION}"
          PLUGIN_OUT="BuildOutput/plugins/K4-WorldText-API"
          SHARED_OUT="BuildOutput/shared/K4-WorldText-SharedAPI"

          for f in K4-WorldText-API.dll K4-WorldText-API.pdb K4-WorldText-API.deps.json; do
            if [ ! -f "${PLUGIN_OUT}/${f}" ]; then
              echo "::error::${f} not found in ${PLUGIN_OUT} after build"
              exit 1
            fi
          done
          for f in K4-WorldText-SharedAPI.dll K4-WorldText-SharedAPI.pdb K4-WorldText-SharedAPI.deps.json; do
            if [ ! -f "${SHARED_OUT}/${f}" ]; then
              echo "::error::${f} not found in ${SHARED_OUT} after build"
              exit 1
            fi
          done

          # CSS install layout: archive root holds K4-WorldText-API-v{version}/
          #   addons/counterstrikesharp/plugins/K4-WorldText-API/  -> plugin dll, pdb, deps.json
          #   addons/counterstrikesharp/shared/K4-WorldText-SharedAPI/ -> API dll, pdb, deps.json
          rm -rf package
          ROOT="package/${FOLDER}"
          PLUGIN_DIR="${ROOT}/addons/counterstrikesharp/plugins/K4-WorldText-API"
          SHARED_DIR="${ROOT}/addons/counterstrikesharp/shared/K4-WorldText-SharedAPI"
          mkdir -p "${PLUGIN_DIR}" "${SHARED_DIR}"

          # Everything the build produced: dll, pdb, deps.json. The shared XML doc file is
          # IntelliSense-only (nothing loads it at runtime), so it stays out of the server zip.
          cp -r "${PLUGIN_OUT}/." "${PLUGIN_DIR}/"
          cp -r "${SHARED_OUT}/." "${SHARED_DIR}/"
          rm -f "${SHARED_DIR}/K4-WorldText-SharedAPI.xml"

          echo "Packaged contents:"
          find "${ROOT}" -type f | sort

          cd package
          zip -r "../${FOLDER}.zip" "${FOLDER}"
          cd ..
          echo "Created ${FOLDER}.zip"

      - name: Prepare release artifact
        id: zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          ZIP_SRC=$(find . -name "K4-WorldText-API-v${VERSION}.zip" -not -path "./release-artifacts/*" | head -1)
          if [ -z "$ZIP_SRC" ]; then
            echo "::error::K4-WorldText-API-v${VERSION}.zip not found after build"
            exit 1
          fi
          echo "Found zip: $ZIP_SRC"

          mkdir -p release-artifacts
          NEW_NAME="K4-WorldText-API-v${VERSION}.zip"
          mv "$ZIP_SRC" "release-artifacts/$NEW_NAME"
          echo "artifact=release-artifacts/$NEW_NAME" >> $GITHUB_OUTPUT
          echo "Prepared: $NEW_NAME"

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BASE_TAG="v${VERSION}"
          TAG="$BASE_TAG"
          TITLE="${BASE_TAG}"
          BUILD_NUM=1

          while gh release view "$TAG" &>/dev/null; do
            BUILD_NUM=$((BUILD_NUM + 1))
            TAG="${BASE_TAG}-${BUILD_NUM}"
            TITLE="${REPO_NAME} | ${BASE_TAG}#${BUILD_NUM}"
            echo "Tag exists, trying: $TAG"
          done

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Get previous tag for changelog link
        id: prev_tag
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "prev_tag=$PREV" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="${{ steps.tag.outputs.title }}"
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"

          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Pull this version's section out of CHANGELOG.md (header line excluded).
          # Matches both "## [x.y.z](...)" and "### [x.y.z](...)" style headings.
          NOTES_FILE="release_notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              found && /^##+ \[/ { exit }
              $0 ~ ("^##+ \\[" ver "\\]") { found=1; next }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          else
            : > "$NOTES_FILE"
          fi

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::warning::No CHANGELOG.md entry found for ${VERSION}, using default release notes"
            echo "Release ${TAG}" > "$NOTES_FILE"
          fi

          if [ -n "$PREV_TAG" ]; then
            printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "${{ github.repository }}" "$PREV_TAG" "$TAG" >> "$NOTES_FILE"
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE_FLAG \
            "${{ steps.zip.outputs.artifact }}"

          echo "Release $TAG created successfully!"
